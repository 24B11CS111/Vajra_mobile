name: vajra_mobile
description: "VAJRA - Always With You. Personal AI Companion."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.0.0

  # Design System
  google_fonts: ^6.3.0
  flutter_animate: ^4.5.2
  responsive_framework: ^1.5.1

  # Icons
  lucide_icons_flutter: ^3.0.5

  # Avatar
  rive: ^0.13.20

  # Network
  dio: ^5.9.0
  logger: ^2.6.1
  uuid: ^4.3.3
  speech_to_text: ^7.4.0

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1

  # JSON
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Utilities
  intl: ^0.20.1
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.5.4
  freezed: ^3.1.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
  - assets/animations/
  - assets/images/
